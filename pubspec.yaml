name: food_ordering_app
description: "Dum Yani - Premium Biryani Food Ordering App"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  cached_network_image: ^4.0.7
  flutter_svg: ^2.4.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Dum Yani food photographs
  assets:
    - assets/images/biryani/
    - assets/images/logo/
    - assets/videos/
